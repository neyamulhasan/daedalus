[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-ai"
version = "0.1.0"
description = "Daedalus: a lightweight offline-first AI CLI for local projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "prompt_toolkit>=3.0",
  "pygments>=2.17",
  "rich>=13.7",
]

[project.scripts]
daedalus = "daedalus.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
